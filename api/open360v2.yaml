        User:
          type: object
          required:
            - id
            - email
            - lastUpdatedDetails
          properties:
            id:
              type: string
              description: ID univoco utente definito dal Auth Server di Asso.
            firstName:
              type: [null, string]
              description: Nome dell'utente.
            lastName:
              type: [null, string]
              description: Cognome dell'utente.
            displayName:
              type: string
              description: Nome visualizzato dell'utente, può essere "Anonimo" se non specificato.
              default: "Anonimo"
            email:
              type: string
              format: email
              description: Indirizzo email dell'utente.
            birthDate:
              type: [null, string]
              format: date
              description: Data di nascita dell'utente (formato YYYY-MM-DD).
              example: "1990-01-15"
            gender: 
              $ref: '#/components/schemas/Gender'
              default: "Non specificato"
            photoUrl:
              type: [null, string]
              format: uri
              description: URL della foto profilo dell'utente, può essere null.
            lastLoginAt:
              type: [null, string]
              format: date-time
              description: Timestamp ISO 8601 dell'ultimo accesso dell'utente.
              example: "2024-05-22T11:30:00Z"
            fiscalCode: 
              type: [null, string]
              description: Codice Fiscale dell'utente.
              pattern: "^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$"
              example: "RSSMRA90A15H501Z"
            placeOfBirth: 
              $ref: '#/components/schemas/Address'
              description: Dettagli del luogo di nascita dell'utente.
            address: 
              $ref: '#/components/schemas/Address'
              description: Indirizzo di residenza dell'utente.
            phone: 
              type: [null,string]
              description: Numero di telefono dell'utente.
            lastUpdatedDetails:
              type: string
              format: date-time
              description: Timestamp aggiornamento dati (formato ISO 8601)

        Gender:
          type: string
          description: Sesso dell'utente.
          enum:
            - "M"
            - "F"
            - "Non specificato"

        Card: 
          type: object
          description: Rappresenta una tessera associata a un utente.
          required:
            - center
            - number
            - type
            - level
          properties:
            center:
              $ref: '#/components/schemas/Address'
            number: 
              type: string
              description: Numero univoco della tessera.
              example: "TC0012345"
            type: 
              type: string
              description: Tipo di tessera.
              enum:
                - "Socio"
                - "Iscritto"
                - "Tesserato"
              example: "Socio"
            level: 
              type: string
              description: Livello della tessera (richiesto da Tennis Comunanza).
              enum:
                - "tessera gold"
                - "tessera silver"
              example: "tessera gold"

        Child: 
          type: object
          required:
            - id
            - firstName
            - lastName
            - displayName
            - birthDate
            - gender
            - fiscalCode
            - placeOfBirth
          properties:
            id:
              type: string
              description: ID univoco figlio dell'Utente
            firstName:
              type: string
              description: Nome del figlio.
            lastName:
              type: string
              description: Cognome del figlio (diverso da quello della madre).
              example: "Rossi"
            displayName:
              type: string
              description: Nome completo del figlio.
            birthDate:
              type: string
              format: date
              description: Data di nascita dell'utente (formato YYYY-MM-DD).
              example: "1990-01-15"
            gender: 
              type: string
              description: Sesso dell'utente.
              enum:
                - "M"
                - "F"
            fiscalCode: 
              type: string
              description: Codice Fiscale dell'utente.
              pattern: "^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$"
              example: "RSSMRA90A15H501Z"
            placeOfBirth: 
              $ref: '#/components/schemas/Address'
              description: Dettagli del luogo di nascita dell'utente.
            address: 
              $ref: '#/components/schemas/Address'
              description: Indirizzo di residenza del figlio.

        UserPurchase: 
          type: object
          description: Iscrizione o prenotazione acquistata dall'Utente
          required:
            - id
            - centerId
            - centerName
            - centerLogoUrl
            - activityId
            - activityTitle
            - registeredUser
            - payment
            - availablePaymentMethods
            - createDate
          properties:
            id:
              type: string
              description: ID univoco utente definito dal Auth Server di Asso.
            centerId:
              type: string
              description: ID del centro in cui è stato effettuato l'acquisto
            centerName:
              type: string
              description: Nome del centro in cui è stato effettuato l'acquisto
            centerLogoUrl:
              type: string
              format: uri
              description: URL del logo del centro in cui è stato effettuato l'acquisto 
            activityId:
              type: string
              description: ID dell'attività acquistata
            activityTitle:
              type: string
              description: Nome dell'attività acquistata
            isChildsEnrollment:
              type: boolean
              default: false
              description: Indica se l'iscrizione è dell'utente stesso (false) o di un figlio (true)
            registeredUser:
              type: string
              description: Nome dell'iscritto (utente o figlio)
            notes:
              type: string
              default: ''
              description: Testo libero inserito dall'utente (preferenze, allergie, richieste particolari, ecc.)
            chosenCustomOptions:
              type: array
              description: Opzioni di iscrizione selezionate (titolo-valore)
              items:
                type: object
                required:
                  - title
                  - value
                properties:
                  title: 
                    type: string
                  value:
                    type: string
            chosenServices:
              type: array
              description: Servizi aggiuntivi scelti dall'utente al momento dell'iscrizione
              items:
                type: object
                required:
                  - description
                properties:
                  description:
                    type: string
                  quantity: 
                    type: [null, integer]
            availablePaymentMethods:
              description: Modalità di pagamento ammesse per questa iscrizione (sono le modalità ammesse al momento dell'acquisto e non variano se il centro le modifica in un secondo momento prima che l'utente esegua il pagamento)
              type: array
              minItems: 1
              items: 
                $ref: '#/components/schemas/PaymentMethod'
            payment:
              type: object
              description: Informazioni relative al pagamento di questo acquisto
              required:
                - paidInstallmentsCount
                - paidAmount
                - totalAmount
                - installmentsDetails
              properties:
                paidInstallmentsCount:
                  type: integer
                  description: Numero di rate pagate (il numero di rate totali è la lunghezza dell'array di dettaglio)
                paidAmount:
                  type: number
                  description: Importo già saldato
                totalAmount:
                  type: number
                  description: Importo totale
                installmentsDetails:
                  description: Dettaglio del piano rate (pagate o da pagare)
                  type: array
                  minItems: 1
                  items: 
                    $ref: '#/components/schemas/UserPurchaseInstallmentDetail'
            createDate:
              type: string
              format: date
              description: Data di inserimento dell'iscrizione

        UserPurchaseInstallmentDetail:
          type: object
          description: Dettaglio della rata
          required:
            - paymentIntentId
            - number
            - amount
            - expirationDate
            - paid
          properties:
            paymentIntentId:
              type: integer
              description: ID dell'impegno di pagamento relativo alla rata (da utilizzare per pagare la rata o per scaricarne la ricevuta in caso sia già stata pagata)
            number: 
              type: integer
              description: Progressivo
            amount:
              type: number
            expirationDate:
              type: string
              format: date
            paid: 
              type: boolean
            paidAt:
              type: [null, string]
              format: date
            bankTransferReference:
              type: [null, string]
              description: Causale che il cliente deve indicare nel bonifico quando paga questa rata, per aiutare il centro con la riconciliazione
            bankTransferAccountantUrl:
              type: [null, string]
              format: uri
              description: Link alla contabile del bonifico che attesta l'avvenuto pagamento (balorizzato solo se l'utente paga con bonifico e carica una contabile)


        PaymentMethod:
          type: object
          description: Modalità di pagamento accettate da un centro
          required:
            - id
            - title
            - description
            - type
          properties:
            id:
              type: integer
            title:
              type: string
            description:
              type: string
            iban:
              type: [null, string]
              description: IBAN del conto corrente per il bonifico (solo per tipo bonifico)
            type:
              type: string
              enum:
                - pay at center
                - pay in App
                - bank transfer

        Address:
          type: object
          properties:
            road:
              type: [null,string]
            zipCode:
              type: [null,string]
            city:
              type: [null,string]
            district:
              type: [null,string]
            country:
              type: [null,string]


