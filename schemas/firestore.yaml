openapi: 3.1.0
info:
  title: Firestore types
  version: 1.0.0
  description: Tipi condivisi Firestore

paths:
  /CodiceOTP:
    get:
      summary: Restituisce il codice OTP
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Codice OTP restituito correttamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodiceOTP'

  /centers:
    get:
      summary: Restituisce la lista di tutti i centri
      responses:
        '200':
          description: Lista dei centri
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Center'

  /centers/{centerId}:
    get:
      summary: Restituisce i dettagli di un centro specifico
      parameters:
        - name: centerId
          in: path
          required: true
          description: ID univoco del centro
          schema:
            type: string
      responses:
        '200':
          description: Dati del centro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Center'
        '404':
          description: Centro non trovato

  /centers/{centerId}/activity:
    get:
      summary: Restituisce la lista delle attività di un centro
      parameters:
        - name: centerId
          in: path
          required: true
          description: ID univoco del centro
          schema:
            type: string
      responses:
        '200':
          description: Lista delle attività di un centro
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
        '404':
          description: Centro non trovato

  /centers/{centerId}/activity/{activityId}:
    get:
      summary: Restituisce i dettagli di un'attività specifica
      parameters:
        - name: centerId
          in: path
          required: true
          description: ID del centro
          schema:
            type: string
        - name: activityId
          in: path
          required: true
          description: ID unico dell'attività
          schema:
            type: string
      responses:
        '200':
          description: Dati dell'attività
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '404':
          description: Centro o attività non trovata

  /search:
    get:
      summary: Restituisce i risultati da visualizzare nella pagina di ricerca dell'app
      responses:
        '200':
          description: Risultati ricerca
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchItem'

  /users:
    get:
      summary: Utenti dell'app Open360
      responses:
        '200':
          description: Lista Utenti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

components:
  schemas:
    # TODO: tradurre in inglese !
    CodiceOTP:
      type: object
      properties:
        idSoggetto:
          type: string
        idCentro:
          type: string
        email:
          type: string
          format: email
        idUtente:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    Center:
      type: object
      required:
        - id
        - name
        - logoUrl
        - landingImageUrl
        - paymentMethods
        - lastUpdatedDetails
      properties:
        id:
          type: string
          description: ID univoco del centro
        name:
          type: string
          description: Nome del centro
        description:
          type: string
          default: ''
          description: Descrizione (HTML)
        address:
          $ref: '#/components/schemas/Address'
        location:
          $ref: '#/components/schemas/Location'
        logoUrl:
          type: string
          format: uri
          description: URL del logo del centro
        landingImageUrl:
          type: string
          format: uri
          description: URL dell'immagine di copertina (landing)
        timetable:
          type: [null,string]
          description: Informazioni sugli orari di apertura/attività
        availableServices:
          type: [null,string]
          description: Elenco o descrizione dei servizi disponibili
        paymentMethods:
          description: Modalità di pagamento ammesse da un centro (es. paga in centro, paga in app, bonifico, ...)
          type: array
          minItems: 1
          items: 
            $ref: '#/components/schemas/PaymentMethod'
        contacts:
          $ref: '#/components/schemas/Contacts'
        lastUpdatedDetails:
          type: string
          format: date-time
          description: Timestamp aggiornamento dati (formato ISO 8601)

    Location:
      type: object
      properties:
        lat:
          type: number
        long:
          type: number
        geohash:
          type: string

    Contacts:
      type: object
      properties:
        phone:
          type: [null, string]
        email:
          type: [null, string]
        whatsapp:
          type: [null, string]
        website:
          type: [null, string]
        socialMedia:
          $ref: '#/components/schemas/SocialMedia'

    SocialMedia:
      type: array
      items:
        type: object
        required:
          - socialName
          - socialUrl
        properties:
          socialName:
            type: string
          socialUrl:
            type: string
            format: uri

    Activity:
      type: object
      required:
        - id
        - centerId
        - title
        - description
        - startDate
        - endDate
        - subscriptionStartDate
        - subscriptionEndDate
        - type
        - imageUrl
        - priceLists
        - lastUpdatedDetails
      properties:
        id:
          type: string
        centerId:
          type: string
          description: Riferimento del centro proprietario di questa attività
        description:
          type: string
          description: Descrizione dell'attività
        title:
          type: string
          description: Nome dell'attività
        startDate:
          type: string
          format: date
          description: Data di inizio (AAAA-MM-GG)
        endDate:
          type: string
          format: date
          description: Data di fine (AAAA-MM-GG)
        subscriptionStartDate:
          type: string
          format: date
          description: Data di inizio iscrizione (AAAA-MM-GG)
        subscriptionEndDate:
          type: string
          format: date
          description: Data di fine iscrizione (AAAA-MM-GG)
        timetable:
          type: [null,string]
          description: Informazioni sul calendario di svolgimento dell'attività
        type:
          $ref: '#/components/schemas/ActivityType'
        imageUrl:
          type: string
          format: uri
          description: URL dell'immagine di copertina per l'attività
        reserved:
          type: boolean
          default: false
          description: Attitività riservata a soci, tesserati, ...
        membershipCardRequired:
          type: boolean
          default: false
          description: Richiesta tessera
        manualApproved:
          type: boolean
          default: false
          description: Richiesta approvazione manuale dall'amministratore del centro 
        underageReserved:
          type: boolean
          default: false
          description: Riservata ai minorenni
        limit:
          type: [null,number]
          description: Numero di partecipanti massimo  
        allowServicesInstallmentPlan:
          type: boolean
          default: false
          description: Servizi rateizzabili, indica se il prezzo dei servizi scelti debba essere inserito nella prima rata o spalmanto proporzionalmente su ogni rata
        disciplines:
          type: array
          items:
            $ref: '#/components/schemas/Discipline'
        priceLists:
          type: array
          items: 
            $ref: '#/components/schemas/PriceList'
          description: Modalità di pagamento (rateizzazione, ecc.)
        additionalServices:
          type: array
          items: 
            $ref: '#/components/schemas/Service'
          description: Servizi aggiuntivi disponibili per questa attività
        standardServices:
          type: array
          items: 
            $ref: '#/components/schemas/Service'
          description: Servizi inclusi per questa attività
        options:
          type: array
          items: 
            $ref: '#/components/schemas/Option'
          description: Servizi inclusi per questa attività
        extraConcessions:
          type: array
          items: 
            type: string
          description: Agevolazioni e sconti previsti per questa attività
        requiredDocuments:
          type: array
          items: 
            type: string
          description: Documenti richiesti per l'iscrizione (certificati, carta identità, ecc.)
        discount:
          $ref: '#/components/schemas/Discount'
        lastUpdatedDetails:
          type: string
          format: date-time
          description: Timestamp aggiornamento dati (formato ISO 8601)
    
    PriceList:
      type: object
      required:
        - id
        - description
        - installmentNumber
        - price
      properties:
        id:
          type: integer
        description:
          type: string
        installmentNumber:
          type: integer
        price:
          type: number
        installmentsDetail:
          type: array
          items:
            type: object
            required:
              - number
              - amount
            properties:
              number: 
                type: integer
              amount:
                type: number
              expirationDate:
                type: [null, string]
                format: date

    Option:
      type: object
      required:
        - id
        - title
        - values
      properties:
        id:
          type: integer
        title:
          type: string
        values:
          type: array
          items:
            type: string

    Service:
      type: object
      required:
        - id
        - description
      properties:
        id:
          type: integer
        description:
          type: string
        price:
          type: number
          default: 0
        countable:
          type: boolean
          default: false
          description: Indica se il servizio è quantificabile (cioè se l'utente può scegliere la quantità)
        maxQuantity:
          type: [null, number]
          description: In caso di servizi quantificabili, indica la quantità massima selezionabile

    ActivityType:
      type: string
      enum: [Prenotazione, Corso, Evento]
      description: Tipo di attività

    Discount:
      type: object
      properties:
        multiFiglio:
          type: [null,number]
        multiAcquisto:
          type: [null,number]

    SearchItem:
      type: object
      required:
        - id
        - centerId
        - centerName
        - title
        - description
        - bannerUrl
        - city
        - logoUrl
      properties:
        id:
          type: string
        centerId:
          type: string
        activityId:
          type: [null,string]
        centerName:
          type: string
        title:
          type: string
        description:
          type: string
        bannerUrl:
          type: string
          format: uri
        disciplines:
          type: array
          items:
            $ref: '#/components/schemas/Discipline'
        city:
          type: string
        logoUrl:
          type: string
          format: uri
        startDate:
          type: [null,string]
          format: date
        availableSlots:
          type: [null,integer]
        activityType:
          $ref: '#/components/schemas/ActivityType'

    Discipline:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string

    User:
      type: object
      required:
        - id
        - email
        - createdAt
      properties:
        id:
          type: string
          description: ID univoco utente definito dal Auth Server di Asso.
          example: "auth0|1234567890abcdef"
        firstName:
          type: string
          description: Nome dell'utente.
          example: "Mario"
        lastName:
          type: string
          description: Cognome dell'utente.
          example: "Rossi"
        displayName:
          type: string
          description: Nome visualizzato dell'utente, può essere "Anonimo" se non specificato.
          default: "Anonimo"
          example: "Mario Rossi"
        email:
          type: string
          format: email
          description: Indirizzo email dell'utente.
          example: "mario.rossi@example.com"
        birthDate:
          type: string
          format: date
          description: Data di nascita dell'utente (formato YYYY-MM-DD).
          example: "1990-01-15"
        gender: 
          type: string
          description: Sesso dell'utente.
          enum:
            - "M"
            - "F"
            - "Non specificato"
          example: "M"
        photoURL:
          type: string
          format: uri
          nullable: true
          description: URL della foto profilo dell'utente, può essere null.
          example: "https://example.com/photos/mario.jpg"
        createdAt:
          type: string
          format: date-time
          description: Timestamp ISO 8601 della creazione dell'account utente.
          example: "2023-01-01T10:00:00Z"
        lastLoginAt:
          type: string
          format: date-time
          description: Timestamp ISO 8601 dell'ultimo accesso dell'utente.
          example: "2024-05-22T11:30:00Z"
        fiscalCode: 
          type: string
          description: Codice Fiscale dell'utente.
          pattern: "^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$"
          example: "RSSMRA90A15H501Z"
        placeOfBirth: 
          $ref: '#/components/schemas/Address'
          description: Dettagli del luogo di nascita dell'utente.
        address: 
          $ref: '#/components/schemas/Address'
          description: Indirizzo di residenza dell'utente.
        phones: 
          type: array
          description: Elenco dei numeri di telefono dell'utente.
          items:
            type: string

    Card: 
      type: object
      description: Rappresenta una tessera associata a un utente.
      required:
        - center
        - number
        - type
        - level
      properties:
        center:
          $ref: '#/components/schemas/Address'
        number: 
          type: string
          description: Numero univoco della tessera.
          example: "TC0012345"
        type: 
          type: string
          description: Tipo di tessera.
          enum:
            - "Socio"
            - "Iscritto"
            - "Tesserato"
          example: "Socio"
        level: 
          type: string
          description: Livello della tessera (richiesto da Tennis Comunanza).
          enum:
            - "tessera gold"
            - "tessera silver"
          example: "tessera gold"

    Child: 
      type: object
      description: Rappresenta un figlio associato a un utente.
      required:
        - id
        - firstName
        - email
        - birthDate
        - gender
        - fiscalCode
        - placeOfBirth
        - address
        - phones
      properties:
        id:
          type: string
          description: ID univoco del figlio.
          example: "child-uuid-123"
        firstName:
          type: string
          description: Nome del figlio.
          example: "Luca"
        email:
          type: string
          format: email
          description: Indirizzo email del figlio.
          example: "luca.rossi@example.com"
        birthDate: 
          type: string
          format: date
          description: Data di nascita del figlio (formato YYYY-MM-DD).
          example: "2015-07-20"
        gender: 
          type: string
          description: Sesso del figlio.
          enum:
            - "M"
            - "F"
            - "Non specificato"
          example: "M"
        fiscalCode:
          type: string
          description: Codice Fiscale del figlio.
          pattern: "^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$"
          example: "LCRRSS15L20H501Z"
        placeOfBirth: 
          $ref: '#/components/schemas/Address'
          description: Dettagli del luogo di nascita del figlio.
        address: 
          $ref: '#/components/schemas/Address'
          description: Indirizzo di residenza del figlio.
        phones:
          type: array
          description: Elenco dei numeri di telefono del figlio.
          items:
            type: string

    PaymentMethod:
      type: object
      required:
        - id
        - title
        - description
        - type
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
            - pay at center
            - pay in App
            - bank transfer

    Address:
      type: object
      properties:
        road:
          type: [null,string]
        zipCode:
          type: [null,string]
        city:
          type: [null,string]
        district:
          type: [null,string]
        country:
          type: [null,string]