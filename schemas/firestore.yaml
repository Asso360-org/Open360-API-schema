openapi: 3.0.3
info:
  title: Firestore types
  version: 1.0.0
  description: Tipi condivisi Firestore

paths:
  /CodiceOTP:
    get:
      summary: Restituisce il codice OTP
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Codice OTP restituito correttamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodiceOTP'

  /centers:
    get:
      summary: Restituisce la lista di tutti i centri
      responses:
        '200':
          description: Lista dei centri
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Center'

  /centers/{centerId}:
    get:
      summary: Restituisce i dettagli di un centro specifico
      parameters:
        - name: centerId
          in: path
          required: true
          description: ID univoco del centro
          schema:
            type: string
      responses:
        '200':
          description: Dati del centro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Center'
        '404':
          description: Centro non trovato

  /centers/{centerId}/activity:
    get:
      summary: Restituisce la lista delle attività di un centro
      parameters:
        - name: centerId
          in: path
          required: true
          description: ID univoco del centro
          schema:
            type: string
      responses:
        '200':
          description: Lista delle attività di un centro
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
        '404':
          description: Centro non trovato

  /centers/{centerId}/activity/{activityId}:
    get:
      summary: Restituisce i dettagli di un'attività specifica
      parameters:
        - name: centerId
          in: path
          required: true
          description: ID del centro
          schema:
            type: string
        - name: activityId
          in: path
          required: true
          description: ID unico dell'attività
          schema:
            type: string
      responses:
        '200':
          description: Dati dell'attività
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '404':
          description: Centro o attività non trovata

  /search:
    get:
      summary: Restituisce i risultati da visualizzare nella pagina di ricerca dell'app
      responses:
        '200':
          description: Risultati ricerca
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchItem'

components:
  schemas:
    # TODO: tradurre in inglese !
    CodiceOTP:
      type: object
      properties:
        idSoggetto:
          type: string
        idCentro:
          type: string
        email:
          type: string
          format: email
        idUtente:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    Center:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: ID univoco del centro
        name:
          type: string
          description: Nome del centro
        description:
          type: string
          description: Descrizione (HTML)
        address:
          $ref: '#/components/schemas/Address'
        location:
          $ref: '#/components/schemas/Location'
        logoUrl:
          type: string
          format: uri
          description: URL del logo del centro
        landingImageUrl:
          type: string
          format: uri
          description: URL dell'immagine di copertina (landing)
        timetable:
          type: string
          description: Informazioni sugli orari di apertura/attività
        availableServices:
          type: string
          description: Elenco o descrizione dei servizi disponibili
        paymentNatures:
          type: array
          items: 
            type: object
            properties:
              type:
                type: string
              description:
                type: string
          description: Nature di pagamento accettate dal centro
        contacts:
          $ref: '#/components/schemas/Contacts'
        lastUpdatedDetails:
          type: string
          format: date-time
          description: Timestamp aggiornamento dati (formato ISO 8601)

    Address:
      type: object
      properties:
        road:
          type: string
        zipCode:
          type: string
        city:
          type: string
        district:
          type: string
        country:
          type: string

    Location:
      type: object
      properties:
        lat:
          type: number
        long:
          type: number
        geohash:
          type: string

    Contacts:
      type: object
      properties:
        phone:
          type: string
        email:
          type: string
        whatsapp:
          type: string
        website:
          type: string
        socialMedia:
          type: string

    Activity:
      type: object
      required:
        - id
        - description
        - type
      properties:
        id:
          type: string
        centerId:
          type: string
          description: Riferimento del centro proprietario di questa attività
        description:
          type: string
          description: Descrizione dell'attività
        details:
          type: string
          description: Altri dettagli aggiuntivi
        startDate:
          type: string
          format: date
          description: Data di inizio (AAAA-MM-GG)
        endDate:
          type: string
          format: date
          description: Data di fine (AAAA-MM-GG)
        subscriptionStartDate:
          type: string
          format: date
          description: Data di inizio iscrizione (AAAA-MM-GG)
        subscriptionEndDate:
          type: string
          format: date
          description: Data di fine iscrizione (AAAA-MM-GG)
        timeStart:
          type: string
          format: time
          description: Ora di inizio in formato ISO 8601 UTC
        type:
          type: string
          enum: [Prenotazione, Iscrizione, Evento]
          description: Tipo di attività
        imageUrl:
          type: string
          format: uri
          description: URL dell'immagine di copertina per l'attività
        reserved:
          type: boolean
          default: false
          description: Attitività riservata a soci, tesserati, ...
        membershipCardRequired:
          type: boolean
          default: false
          description: Richiesta tessera
        manualApproved:
          type: boolean
          default: false
          description: Richiesta approvazione manuale dall'amministratore del centro 
        underageReserved:
          type: boolean
          default: false
          description: Riservata ai minorenni
        limit:
          type: number
          description: Numero di partecipanti massimo  
        baseActivities:
          type: array
          items: 
            type: string
          description: Discipline sportive collegate all'attività
        price:
          type: number
          description: Costo o prezzo dell'iscrizione
        paymentModalities:
          type: array
          items: 
            type: string
          description: Modalità di pagamento (rateizzazione, ecc.)
        availableServices:
          type: array
          items: 
            type: string
          description: Servizi aggiuntivi disponibili per questa attività
        extraConcessions:
          type: array
          items: 
            type: string
          description: Agevolazioni e sconti previsti per questa attività
        requiredDocuments:
          type: array
          items: 
            type: string
          description: Documenti richiesti per l'iscrizione (certificati, carta identità, ecc.)
        discount:
          $ref: '#/components/schemas/Discount'
        lastUpdatedDetails:
          type: string
          format: date-time
          description: Timestamp aggiornamento dati (formato ISO 8601)

    Discount:
      type: object
      properties:
        multiFiglio:
          type: string
        multiAcquisto:
          type: string

    SearchItem:
      type: object
      required:
        - id
        - centerName
        - description
        - bannerUrl
        - city
        - logoUrl
        - type
      properties:
        id:
          type: string
        centerName:
          type: string
        description:
          type: string
        bannerUrl:
          type: string
          format: uri
        disciplines:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              iconUrl:
                type: string
                format: uri
        city:
          type: string
        logoUrl:
          type: string
          format: uri
        startDate:
          type: string
          format: date
        availableSlots:
          type: integer
        type:
          type: string
